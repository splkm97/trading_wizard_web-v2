apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: trading-wizard
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: splkm97/trading-wizard-backend:a691754
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: trading-wizard-config
            - secretRef:
                name: trading-wizard-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trading-wizard
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
