apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-portfolio
  namespace: trading-wizard
  labels:
    app: my-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-portfolio
  template:
    metadata:
      labels:
        app: my-portfolio
    spec:
      containers:
        - name: my-portfolio
          image: splkm97/trading-wizard-my-portfolio:a691754
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: trading-wizard-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: my-portfolio
  namespace: trading-wizard
spec:
  selector:
    app: my-portfolio
  ports:
    - port: 80
      targetPort: 80
