apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-focus
  namespace: trading-wizard
  labels:
    app: daily-focus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daily-focus
  template:
    metadata:
      labels:
        app: daily-focus
    spec:
      containers:
        - name: daily-focus
          image: splkm97/trading-wizard-daily-focus:a691754
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: trading-wizard-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: daily-focus
  namespace: trading-wizard
spec:
  selector:
    app: daily-focus
  ports:
    - port: 80
      targetPort: 80
